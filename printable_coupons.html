<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jennifer's Christmas Coupons - Print Now</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400&display=swap" rel="stylesheet">
<style>
    /* Reset & Page Setup */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Lato', sans-serif;
        background: #eee;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }

    /* Screen Instructions */
    .screen-only {
        text-align: center;
        padding: 20px;
        background: #333;
        color: white;
        margin-bottom: 20px;
    }
    h1 { font-family: 'Playfair Display', serif; color: #ffd700; margin-bottom: 10px; }
    .print-btn {
        background: #d4af37; color: black; border: none; padding: 15px 30px;
        font-size: 1.2rem; cursor: pointer; border-radius: 4px;
        font-weight: bold; margin-top: 10px;
    }
    .print-btn:hover { background: #fff; }

    /* Print Layout: 8.5" x 11" with 2x5 Grid */
    @page {
        size: letter;
        margin: 0.5in;
    }

    .page {
        width: 7.5in;
        height: 10in;
        margin: 0 auto 20px auto;
        display: grid;
        grid-template-columns: repeat(2, 3.5in);
        grid-auto-rows: 2in;
        gap: 0;
        justify-content: center;
        align-content: start;
        background: white;
        page-break-after: always;
        position: relative;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .page-label {
        position: absolute;
        top: -25px;
        left: 0;
        width: 100%;
        text-align: center;
        font-weight: bold;
        color: #999;
        font-size: 0.8rem;
    }

    /* Coupon Styles */
    .coupon {
        width: 3.5in;
        height: 2in;
        border: 1px dashed #ddd;
        padding: 15px;
        display: flex;
        align-items: center;
        background: white;
        position: relative;
        overflow: hidden;
    }

    .coupon-back {
        width: 3.5in;
        height: 2in;
        border: 1px dashed #ddd;
        padding: 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: #fdfbf7; /* Slight cream for back */
        position: relative;
        text-align: center;
    }

    .coupon-info {
        flex: 1;
        padding-right: 15px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        height: 100%;
        z-index: 2;
    }

    .coupon-title {
        font-size: 16pt;
        font-family: 'Playfair Display', serif;
        font-weight: bold;
        color: #5d001e;
        line-height: 1.1;
        margin-bottom: 8px;
    }

    .coupon-cat {
        font-size: 8pt;
        text-transform: uppercase;
        color: #d4af37; /* Gold */
        letter-spacing: 1px;
        margin-bottom: 4px;
        font-weight: bold;
    }

    .coupon-code {
        font-family: monospace;
        font-size: 9pt;
        color: #888;
        background: #f5f5f5;
        padding: 2px 6px;
        border-radius: 4px;
        align-self: flex-start;
    }

    .coupon-qr {
        width: 100px;
        height: 100px;
        flex-shrink: 0;
        border: 2px solid #5d001e;
        padding: 2px;
    }
    .coupon-qr img {
        width: 100%;
        height: 100%;
        display: block;
    }

    .decoration {
        position: absolute;
        top: -15px; right: -15px;
        font-size: 4rem; color: rgba(212, 175, 55, 0.1);
        pointer-events: none;
        z-index: 1;
    }

    /* Back Side */
    .back-title {
        font-family: 'Playfair Display', serif;
        font-size: 14pt;
        color: #5d001e;
        font-weight: bold;
        margin-bottom: 10px;
    }
    .back-desc {
        font-size: 10pt;
        color: #555;
        margin-bottom: 15px;
        font-style: italic;
    }
    .back-serial {
        font-family: monospace;
        font-size: 8pt;
        color: #aaa;
        position: absolute;
        bottom: 10px;
        right: 15px;
    }
    .back-decor {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        font-size: 5rem;
        color: rgba(93, 0, 30, 0.05);
        pointer-events: none;
    }

    @media print {
        body { background: white; margin: 0; }
        .screen-only { display: none; }
        .page-label { display: none; }
        .page { margin: 0; border: none; box-shadow: none; margin-bottom: 0; }
        .coupon, .coupon-back { border: 1px solid #eee; }
    }
</style>
</head>
<body>

<div class="screen-only">
    <h1>🎄 Last Minute Gift Mode 🎄</h1>
    <p>1. <b>Save</b> this file or keep it open.<br>
       2. <b>Print</b> (Ctrl+P / Cmd+P).<br>
       3. Select <b>Double-Sided</b> (Flip on Long Edge).<br>
       4. Cut and Gift! (Setup the server later).</p>
    <button class="print-btn" onclick="window.print()">🖨️ PRINT COUPONS NOW</button>
</div>

<div id="content"></div>

<script>
    // --- 1. DATA (Embedded for offline use) ---
    // 30 items for perfect 2x5 grid layout (3 sheets front/back)
    const coupons = [
        {name: "Back Scratching (5m)", cat: "Relaxation"},
        {name: "Back Scratching (5m)", cat: "Relaxation"},
        {name: "Foot Rub (15m)", cat: "Relaxation"},
        {name: "Foot Rub (15m)", cat: "Relaxation"},
        {name: "Back Massage (30m)", cat: "Relaxation"},
        {name: "Back Scratching (10m)", cat: "Relaxation"},
        {name: "Spa Day (Baby Watch)", cat: "Relaxation"},
        {name: "Sleep In", cat: "Relaxation"},
        {name: "24hr Mom Break", cat: "Relaxation"},
        {name: "Tech Free Hour", cat: "Quality Time"},
        {name: "Watch Movie (No Work)", cat: "Quality Time"},
        {name: "Trip to Lake", cat: "Adventure"},
        {name: "Go on a Hike", cat: "Adventure"},
        {name: "Do Dishes (All Day)", cat: "Chores"},
        {name: "Vacuum & Mop", cat: "Chores"},
        {name: "Do Laundry (All Day)", cat: "Chores"},
        {name: "Grocery Shopping", cat: "Chores"},
        {name: "Organize A Room", cat: "Chores"},
        {name: "Diaper Duty (All Day)", cat: "Chores"},
        {name: "Pay For Gas (Tank)", cat: "Gifts"},
        {name: "Personal Chauffeur", cat: "Service"},
        {name: "One 'Yes' Day", cat: "Special"},
        {name: "Wildcard #1", cat: "Special"},
        {name: "Wildcard #2", cat: "Special"},
        {name: "Breakfast in Bed", cat: "Food"},
        {name: "Dinner Choice", cat: "Food"},
        {name: "Ice Cream Date", cat: "Food"},
        {name: "Game Night", cat: "Quality Time"},
        {name: "Walk in the Park", cat: "Adventure"},
        {name: "Car Wash", cat: "Chores"}
    ];

    // Helper to generate IDs
    function genId(idx) {
        const p1 = Math.random().toString(36).substring(2,6).toUpperCase();
        const p2 = Math.random().toString(36).substring(2,6).toUpperCase();
        // Use consistent IDs for this session if possible, but random is fine for printing
        return \`XMAS-\${(idx+1).toString().padStart(2,'0')}-\${p1}\`;
    }

    const items = coupons.map((c, i) => ({ ...c, id: genId(i) }));

    // --- 2. RENDER LOGIC ---
    function render() {
        const container = document.getElementById('content');

        // Use a placeholder IP for now. User can set static IP later.
        const baseUrl = "http://192.168.1.50:6969/redeem.html?code=";

        for (let i = 0; i < items.length; i += 10) {
            const chunk = items.slice(i, i + 10);
            const pageNum = (i / 10) + 1;

            // --- FRONT PAGE ---
            const f = document.createElement('div');
            f.className = 'page';
            f.innerHTML = \`<div class="screen-only page-label">Sheet \${pageNum} (FRONT)</div>\`;

            chunk.forEach(item => {
                const qrUrl = \`https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=\${encodeURIComponent(baseUrl + item.id)}\`;

                f.innerHTML += \`
                    <div class="coupon">
                        <div class="decoration">❄</div>
                        <div class="coupon-info">
                            <div class="coupon-cat">\${item.cat}</div>
                            <div class="coupon-title" contenteditable="true">\${item.name}</div>
                            <div class="coupon-code">\${item.id}</div>
                        </div>
                        <div class="coupon-qr">
                            <img src="\${qrUrl}" alt="QR">
                        </div>
                    </div>
                \`;
            });
            container.appendChild(f);

            // --- BACK PAGE (MIRRORED) ---
            const b = document.createElement('div');
            b.className = 'page';
            b.innerHTML = \`<div class="screen-only page-label">Sheet \${pageNum} (BACK - FLIP ON LONG EDGE)</div>\`;

            for (let r = 0; r < 5; r++) { // 5 Rows
                const leftIdx = r * 2;
                const rightIdx = r * 2 + 1;

                const itemL = chunk[leftIdx];
                const itemR = chunk[rightIdx];

                // Mirror logic:
                // Front Left -> Back Right
                // Front Right -> Back Left

                // Position 1 (Left on Back Sheet) = Back of Front Right
                b.appendChild(createBack(itemR));

                // Position 2 (Right on Back Sheet) = Back of Front Left
                b.appendChild(createBack(itemL));
            }
            container.appendChild(b);
        }
    }

    function createBack(item) {
        const div = document.createElement('div');
        div.className = 'coupon-back';
        if (!item) {
            div.style.border = 'none'; // spacer
            return div;
        }

        div.innerHTML = \`
            <div class="back-decor">🎄</div>
            <div class="back-title">\${item.name}</div>
            <div class="back-desc">Redeemable for one use.</div>
            <div class="back-serial">Serial: \${item.id}</div>
        \`;
        return div;
    }

    render();
</script>
</body>
</html>
